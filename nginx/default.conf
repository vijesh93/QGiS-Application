# In-container gateway config (built into the "gateway" image, see nginx/Dockerfile).
# Serves the built frontend and proxies the backend API + TiTiler under the same
# origin, so the browser never needs to know about the backend/raster-server
# container ports or deal with cross-origin requests.
#
# This is NOT the host-level nginx (installed directly on the server). That one
# just proxies a public port to this container's published port. See
# deploy/host-nginx-app.conf.example and docs/deployment_plan.md for that layer.

server {
    listen 80;
    server_name _;

    # Static frontend (Vite build output), SPA fallback for client-side routing
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend metadata API
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TiTiler raster tiles. Forwarded as-is (no path rewrite beyond the prefix
    # strip below) so the "url=" query parameter TiTiler expects reaches it
    # unmodified.
    location /titiler/ {
        proxy_pass http://raster-server:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
